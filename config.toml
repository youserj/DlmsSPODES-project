datefmt = "%d.%m %H:%M:%S"
handlers = [
    { type = "Stream" },
    { type = "File", b = 5 },
]
state_level = 19

[DLMSClient.from_csv.header_names]
secret = [
    "secret",
    "pass",
    "пароль",
]
ip = [
    "ip",
    "addr",
    "адрес",
]
name = [
    "name",
    "пу",
    "имя",
]
port = [
    "port",
    "порт",
]
m_id = [
    "m_id",
    "безопасность",
]
sap = [
    "sap",
    "номер.клиента",
]
da = [
    "da",
    "физ.адрес",
]
timeout = [
    "timeout",
    "таймаут",
]

[DLMSClient.session.results]
depth = 5

[DLMSClient.session.worker]
run = true
time_checking = 1.0

[CONTROL.themes.icons]
size = [
    20,
    20,
]

[tKot.pydantic.BaseModelEditor]
title = "Настройки"
save = "Сохранить"

[tKot.pydantic.BaseModelEditor.heading]
name = "имя"
value = "значение"
